name: fast_location
description: FastLocation - consulta de endereços por CEP e de CEP por endereço (FastDelivery).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  dio: ^4.0.6
  flutter_mobx: ^2.0.4
  mobx: ^2.0.6+1
  hive: ^2.1.0
  hive_flutter: ^1.1.0
  path: ^1.8.0
  path_provider: ^2.0.2
  path_provider_android: ^2.0.14
  path_provider_ios: ^2.0.9
  # Enunciado: ^2.2.1+1. A linha 2.x usa a "v1 embedding" do Android, removida do
  # Flutter atual, e não compila mais; a 3.4.0 foi a primeira sem ela. A 3.5.0
  # mantém a mesma API usada no app (installedMaps, showDirections, Coords).
  map_launcher: ^3.5.0
  geocoding: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  mobx_codegen: ^2.0.1+3
  build_runner: ^2.0.5
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
