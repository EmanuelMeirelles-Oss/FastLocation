name: Build e testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versão do Flutter
        run: flutter --version

      - name: Gerar pastas nativas (somente Android e iOS)
        run: flutter create --platforms=android,ios --org com.fastdelivery --project-name fast_location .

      - name: Permitir abrir apps de mapas no iOS (Info.plist)
        run: |
          python3 - <<'PY'
          p = 'ios/Runner/Info.plist'
          s = open(p, encoding='utf-8').read()
          if 'LSApplicationQueriesSchemes' not in s:
              add = ('\t<key>LSApplicationQueriesSchemes</key>\n\t<array>\n'
                     '\t\t<string>comgooglemaps</string>\n\t\t<string>waze</string>\n\t</array>\n')
              i = s.rfind('</dict>')
              s = s[:i] + add + s[i:]
              open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar código (MobX e Hive)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Análise estática
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes
        run: flutter test

      - name: Build do APK
        run: flutter build apk --release

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: fast_location-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar o APK como release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/app/outputs/flutter-apk/app-release.apk \
            --title "FastLocation (APK mais recente)" \
            --notes "APK gerado automaticamente a partir do último commit da main." \
            --target "${GITHUB_SHA}"

      - name: Versionar as pastas nativas e o código gerado
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios lib pubspec.lock .metadata test || true
          if git diff --cached --quiet; then
            echo "Nada novo para versionar."
          else
            git commit -m "chore: pastas nativas e código gerado pelo Flutter [skip ci]"
            git push
          fi
