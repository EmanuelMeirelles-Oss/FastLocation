name: Build e testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versão do Flutter
        run: flutter --version

      - name: Gerar pastas nativas (somente Android e iOS)
        run: flutter create --platforms=android,ios --org com.fastdelivery --project-name fast_location .

      - name: Permitir abrir apps de mapas no iOS (Info.plist)
        run: |
          python3 - <<'PY'
          p = 'ios/Runner/Info.plist'
          s = open(p, encoding='utf-8').read()
          if 'LSApplicationQueriesSchemes' not in s:
              add = ('\t<key>LSApplicationQueriesSchemes</key>\n\t<array>\n'
                     '\t\t<string>comgooglemaps</string>\n\t\t<string>waze</string>\n\t</array>\n')
              i = s.rfind('</dict>')
              s = s[:i] + add + s[i:]
              open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar código (MobX e Hive)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Análise estática
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes
        run: flutter test

      - name: Versões resolvidas dos plugins
        run: |
          python3 - <<'PY'
          import re
          t = open('pubspec.lock', encoding='utf-8').read()
          names = ['dio','mobx','flutter_mobx','hive','hive_flutter','path_provider','path_provider_android','map_launcher','geocoding','geocoding_android','geocoding_ios']
          out = []
          for n in names:
              m = re.search(r'\n  ' + n + r':\n(?:    .*\n)*?    version: "([^"]+)"', t)
              out.append(f'{n}={m.group(1) if m else "?"}')
          print('::notice title=Versões::' + ' '.join(out))
          PY

      - name: Build do APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Mostrar o erro do build
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          if not os.path.exists('build.log'):
              raise SystemExit(0)
          t = open('build.log', encoding='utf-8', errors='ignore').read()
          parts = []
          start = 0
          while True:
              i = t.find('What went wrong', start)
              if i < 0:
                  break
              parts.append(t[max(0, i - 300): i + 2500])
              start = i + 1
          if not parts:
              parts = [t[-5000:]]
          for p in parts[:5]:
              p = p.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print('::error title=Build do APK::' + p)
          PY

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: fast_location-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar o APK como release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/app/outputs/flutter-apk/app-release.apk \
            --title "FastLocation (APK mais recente)" \
            --notes "APK gerado automaticamente a partir do último commit da main." \
            --target "${GITHUB_SHA}"

      - name: Versionar as pastas nativas e o código gerado
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios lib pubspec.lock .metadata test || true
          if git diff --cached --quiet; then
            echo "Nada novo para versionar."
          else
            git commit -m "chore: pastas nativas e código gerado pelo Flutter [skip ci]"
            git push
          fi
